# kind create cluster --config k8s/kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-relay
nodes:
  - role: control-plane
    extraPortMappings:
      # Relay NodePort -> http://127.0.0.1:8080 on this machine.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
