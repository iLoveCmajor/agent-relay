apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        # The relay creates its tables on startup, so wait for the database.
        - name: wait-for-postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: postgres
          # -U is required: UID 1000 has no passwd entry to default a user from.
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U \"$POSTGRES_USER\"; do sleep 2; done"]
      containers:
        - name: relay
          # Loaded with `kind load docker-image agent-relay:local`; never pulled.
          image: agent-relay:local
          imagePullPolicy: Never
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_DB}
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          ports:
            - name: http
              containerPort: 8000
          # /ready checks the database and its tables; /health only the process.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: agent-relay
spec:
  type: NodePort
  selector:
    app: relay
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Mapped to 127.0.0.1:8080 by k8s/kind/cluster.yaml.
      nodePort: 30080
